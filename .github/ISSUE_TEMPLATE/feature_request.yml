name: Feature request
description: Suggest an idea for the GearDex web app, macOS app, or both
labels: [enhancement, "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for product ideas, workflow gaps, and user-facing improvements.
  - type: dropdown
    id: surface
    attributes:
      label: Which surface is this for?
      options:
        - Web app (www.geardex.app)
        - macOS app
        - Both web app and macOS app
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What workflow is harder than it should be?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired outcome
      description: What should GearDex help you accomplish?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternatives you've tried?
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checklist
      options:
        - label: I searched for existing feature requests first.
          required: true
