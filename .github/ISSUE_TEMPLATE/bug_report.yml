name: Bug report
description: Report a reproducible issue in the GearDex web app, macOS app, or both
labels: [bug, "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible GearDex web app and macOS app problems. Remove private details from screenshots, logs, filenames, and copied text before submitting.
  - type: dropdown
    id: surface
    attributes:
      label: Where does this issue happen?
      options:
        - Web app (www.geardex.app)
        - macOS app
        - Both web app and macOS app
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: GearDex version or build
      placeholder: e.g. macOS app v1.0.5, or web app date if known
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment details
      placeholder: e.g. Safari 18 on macOS 15, or GearDex macOS app on Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste logs or drag screenshots only after removing private details.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checklist
      options:
        - label: I searched for existing issues first.
          required: true
        - label: I removed private information from logs and screenshots.
          required: true
